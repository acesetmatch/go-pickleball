name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ─── Frontend — Lint & Test ───────────────────────────────────────────────

  frontend:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/paddle-recommender/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/paddle-recommender/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # ─── Backend — Lint, Type-check & Test ───────────────────────────────────

  backend:
    name: Backend — Lint, Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/paddle-recommender/backend/nodejs
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paddle_recommender_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/paddle-recommender/backend/nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paddle_recommender_db

      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paddle_recommender_db

      - name: Seed test data
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paddle_recommender_db

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paddle_recommender_db
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: test

  # ─── Docker — Build, Trivy Scan & Push to ECR ────────────────────────────
  #
  # Required GitHub secrets:
  #   AWS_ROLE_ARN    — IAM role ARN, e.g. arn:aws:iam::123456789012:role/github-actions-paddle-recommender
  #   AWS_REGION      — AWS region where ECR lives, e.g. us-east-1
  #   ECR_REPOSITORY  — ECR repository name, e.g. paddle-recommender
  #
  # Required AWS setup (one-time, see infra/iam/):
  #   1. Create an IAM OIDC identity provider for token.actions.githubusercontent.com
  #   2. Create an IAM role with the trust policy in infra/iam/github-actions-trust-policy.json
  #   3. Attach infra/iam/ecr-push-policy.json to that role
  #   4. Create an ECR repository named paddle-recommender

  docker:
    name: Docker — Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    permissions:
      id-token: write  # required to request the OIDC JWT for AWS auth
      contents: read

    steps:
      - uses: actions/checkout@v4

      # No long-lived AWS keys are stored — the role is assumed dynamically
      # and credentials expire when the job finishes.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build with a local tag so Trivy scans the local daemon image
      # rather than attempting to pull from ECR.
      - name: Build Docker image
        run: |
          docker build \
            --tag paddle-recommender:${{ github.sha }} \
            apps/paddle-recommender/backend/nodejs

      # Security gate: block the push on any CRITICAL or HIGH CVE that has a
      # fix available. ignore-unfixed skips issues with no patch yet — blocking
      # on those produces noise with no actionable remedy.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: paddle-recommender:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Only push on merges to master/main — PRs build and scan but never push.
      # Tags the image with the full commit SHA (immutable + traceable) and
      # also updates :latest for convenience.
      - name: Tag and push image to ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag paddle-recommender:$IMAGE_TAG $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
