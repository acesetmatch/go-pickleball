version: '3.8'

services:
  paddle-api:
    build:
      context: .
      target: builder  # Use builder stage for development
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    command: npm run dev
    ports:
      - "3001:3001"
      - "9229:9229"  # Debug port
